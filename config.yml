# Repo override: set to 'owner/repo' to bypass auto-detection from git remote
# repo: your-org/PestService_iOS

# Timeframe in days
timeframe_days: 90

# Bot or system accounts to exclude from scoring
bots:
  - dependabot
  - dependabot[bot]
  - github-actions
  - github-actions[bot]
  - renovate
  - renovate[bot]

# Optional alias mapping to unify identities across email/login variants
# Example:
# aliases:
#   ben.d: benjidodgson
#   ben@company.com: benjidodgson
aliases: {}

# Metric weights (must sum to 1.0)
weights:
  delivery: 0.30
  collaboration: 0.25
  hygiene: 0.15
  stability: 0.30

# Hygiene thresholds
hygiene:
  small_pr_lines_threshold: 300

# Responsiveness: exclude weekends from review timing metrics
responsiveness:
  exclude_weekends: true

#Exclude specific logins (case-insensitive) from scoring and reports
exclude:
  - cursoragent
  - unknown
  - benjamindodgson
  - cursor
  - snyk-bot

# Azure DevOps bug enrichment (optional)
# When set, devskill will parse PR titles for AB#<id> and pull ADO work items
# to add QA-failed counts and Ready-for-Dev -> Resolved durations per author.
ado:
  org: ecolabcommercialsolutions
  project: Pest Commercial Solutions
  ready_states: ["Ready for Dev"]
  resolved_states: ["Resolved", "Closed", "Done"]
  qa_failed_states: ["QA Failed"]

# QA assessment configuration (Azure DevOps)
qa:
  users: [samina.wasey@ecolab.com,simran.rijal@ecolab.com,nishitha.voleti@ecolab.com,raja.kattoju@ecolab.com,christian.gomez@ecolab.com]
  aliases: {}
  exclude: []
  # Work item types to include for story/defect analysis (team adjustable)
  story_types: ["Product Backlog Item", "Bug", "Feature", "Epic"]
  # States considered part of QA workflow (used for time-in-state metrics)
  qa_states: ["QA Failed", "Ready for Test", "In Test", "Done"]
  # Toggle additional data collection (comments/updates) for deeper metrics
  include_comments: true
  include_updates: true
  weights:
    testing: 0.30
    defects: 0.30
    hygiene: 0.20
    responsiveness: 0.20

