# Repo override: set to 'owner/repo' to bypass auto-detection from git remote
# repo: your-org/PestService_iOS

# Timeframe in days
timeframe_days: 90

# Bot or system accounts to exclude from scoring
bots:
  - dependabot
  - dependabot[bot]
  - github-actions
  - github-actions[bot]
  - renovate
  - renovate[bot]

# Optional alias mapping to unify identities across email/login variants
# Example:
# aliases:
#   ben.d: benjidodgson
#   ben@company.com: benjidodgson
aliases: {}

# Metric weights (must sum to 1.0)
weights:
  delivery: 0.30
  collaboration: 0.25
  hygiene: 0.15
  stability: 0.30

# Hygiene thresholds
hygiene:
  small_pr_lines_threshold: 300

# Responsiveness: exclude weekends from review timing metrics
responsiveness:
  exclude_weekends: true

#Exclude specific logins (case-insensitive) from scoring and reports
exclude:
  - cursoragent
  - unknown
  - benjamindodgson
  - cursor
  - snyk-bot

# Azure DevOps bug enrichment (optional)
# When set, devskill will parse PR titles for AB#<id> and pull ADO work items
# to add QA-failed counts and Ready-for-Dev -> Resolved durations per author.
ado:
  org: ecolabcommercialsolutions
  project: Pest Commercial Solutions
  ready_states: ["Ready for Dev"]
  resolved_states: ["Resolved", "Closed", "Done"]
  qa_failed_states: ["QA Failed"]

# Azure assessment configuration
azure:
  # Org/project used for Azure assessment (defaults to ado.org/project if omitted)
  org: ecolabcommercialsolutions
  project: Pest Commercial Solutions
  # Emails to exclude from Azure assessment (case-insensitive)
  exclude_emails: []
  # Unassigned work items are ignored for scoring
  weights:
    resolution: 0.25
    predictability: 0.25
    velocity: 0.25
    quality: 0.25
  effort_field: Microsoft.VSTS.Scheduling.StoryPoints
  ready_states: ["Ready for Dev"]
  resolved_states: ["Resolved", "Closed", "Done"]
  qa_failed_states: ["QA Failed"]
  # Resolution SLA configuration
  resolution_sla:
    # When true, resolution timing ignores weekend hours (Mon–Fri only)
    use_business_days: true
    # Work item types that use bug/defect SLAs
    bug_types: ["Bug", "Defect"]
    # Priority targets for bug/defect items, expressed in hours
    # (still respects business-day timing when use_business_days is true)
    bug_priority_hours:
      Blocker: 24        # Same-day (24h)
      Critical: 24       # Within 1 business day
      Major: 72          # Within 3 business days
      Minor: 120         # Within 5 business days
      Trivial: 240       # Within 10 business days
    # PBI resolution buckets (hours, inclusive upper bounds)
    pbi_buckets:
      - max_hours: 48
        score: 100
      - max_hours: 72
        score: 75
      - max_hours: 96
        score: 50
      - max_hours: 120
        score: 25
      - max_hours: null    # Anything above previous threshold
        score: 0

# QA assessment configuration (Azure DevOps)
qa:
  users: [samina.wasey@ecolab.com,simran.rijal@ecolab.com,nishitha.voleti@ecolab.com,raja.kattoju@ecolab.com,christian.gomez@ecolab.com]
  aliases: {}
  exclude: []
  # Work item types to include for story/defect analysis (team adjustable)
  story_types: ["Product Backlog Item", "Bug", "Feature", "Epic"]
  # States considered part of QA workflow (used for time-in-state metrics)
  qa_states: ["QA Failed", "Ready for Test", "In Test", "Done"]
  # Toggle additional data collection (comments/updates) for deeper metrics
  include_comments: true
  include_updates: true
  weights:
    testing: 0.30
    defects: 0.30
    hygiene: 0.20
    responsiveness: 0.20

