[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-skill-assessment"
version = "0.1.1"
description = "Run a 90-day GitHub developer assessment against any repository"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "" }]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Benjamindodgson/dev-skill-assessment"
Repository = "https://github.com/Benjamindodgson/dev-skill-assessment"

[project.scripts]
devskill = "devskill.cli:main"
qaskill = "devskill.qa.cli:main"
dev-skill-rerun = "devskill.cli:rerun_entrypoint"
dev-skill-rerun-local = "devskill.cli:rerun_local_entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["devskill*"]


